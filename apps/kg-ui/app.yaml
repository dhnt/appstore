apiVersion: appstore.dhnt.io/v1
kind: AppEntry
metadata:
  id: kg-ui
  name: kg Monitor & Explorer
  version: "0.1"
  categories: [ai-agent, dev-tools]
  tags: [kg, knowledge-graph, dhnt, personal-knowledge-graph, mcp]
  maintainers:
    - email: liqiang@gmail.com
  # Closed source (image at ghcr.io/qiangli/kg-ui is the only
  # distributed artefact; the Go source for the UI is not public),
  # but installable by any cloudbox-authenticated user — the auth
  # gate is "did you sign in to cloudbox", not "do you belong to a
  # specific allowlist." visibility=public is the right tier for
  # that shape and matches the appstore default.
  visibility: public
  description: >
    Monitor + explorer SPA for a running kg daemon. The kg daemon
    walks the user's filesystem and emits a knowledge graph;
    kg-ui surfaces ingestion telemetry, the live event log, the
    queue inspector, and an explorer for the resulting graph.
    Pairs with a host-running `kg daemon` reached through cloudbox
    + outpost — the daemon stays where the filesystem lives, the
    UI runs in DKS.
  homepage: https://github.com/qiangli/kg
spec:
  # Chart is published to qiangli/kg-charts and served via GitHub
  # Pages with the user's account-wide custom domain. The github.io
  # URL (https://qiangli.github.io/kg-charts) 301s to qiang.li, so
  # we point at the canonical apex domain directly to avoid the
  # extra redirect penalty on every install.
  #
  # Chart sources: github.com/qiangli/kg → deploy/charts/kg-ui/
  # Publish recipe: github.com/qiangli/kg-charts → README.md
  chart:
    repo: https://qiang.li/kg-charts
    name: kg-ui
    version: "0.1.0"
  targetNamespace: "{{.UserNamespace}}"
  rbac:
    clusterScoped: false
  defaultValuesFile: values.yaml
