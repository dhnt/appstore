# Default values for a Periscope one-click install (single-namespace tenant).
# For dev/qa/prod separation, use the GitOps ApplicationSet instead
# (examples/hello-tessaro/gitops/).
env: prod
replicaCount: 1
image:
  repository: ghcr.io/qiangli/hello-tessaro
  tag: "0.1.0"
requireHmac: true
# Provide the SSO secret out of band as a Sealed Secret and set ssoSecretName,
# or paste an inline value here for a quick trial (not for production).
ssoSecretName: ""
ssoSecret: ""
adminEmails: []
networkPolicy:
  enabled: true
