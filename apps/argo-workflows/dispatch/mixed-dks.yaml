# mixed DKS dispatcher — the machine-testable statement of the DKS
# contract between Argo Workflows and virtual-kubelet ("native") nodes.
#
# THE CONTRACT
#
#   Argo-owned pods  ->  outpost.dhnt.io/backend=k3s      (HARD, no fallback)
#   The payload pod  ->  outpost.dhnt.io/backend=vk-native (HARD, no fallback)
#
# Argo never runs a step ON vk-native. vk-native provides exactly one
# container, literal env, and no init containers / sidecars / envFrom /
# projected secrets / logs / exec — which is strictly less than argoexec's
# init+wait sidecars require. So the workflow reaches native execution
# INDIRECTLY: an Argo `resource` template (running on k3s) creates an ordinary
# batch/v1 Job, watches its status via the Kubernetes API, and deletes it.
#
# NO FALLBACK. Every placement rule here is a hard `nodeSelector`, never a
# `preferredDuringSchedulingIgnoredDuringExecution` affinity. If the matching
# node class is absent the pod stays Pending and the workflow fails — it must
# never silently execute somewhere else. `backoffLimit: 0` says the same thing
# in the time dimension: no retry onto a different node.
#
# ARTIFACTS. vk-native does not run an OCI image: `dhnt.io/native-process` is a
# marker image only. The executable comes from a release archive selected by
# the three outpost.dhnt.io/native-artifact-* pod annotations. URL, archive
# sha256, and member path are all required submit-time parameters with no
# defaults. The vk-native backend accepts HTTPS (or loopback HTTP), verifies
# the complete archive before extraction, and materializes only the selected
# regular file. OS and architecture remain explicit because the archive must
# contain a native executable for the selected host.
#
# RESULTS. The native process may return one small file (at most 2 KiB) in one
# canonical dhnt.native-result/v1 marker inside Outpost's opt-in 4 KiB terminal
# tail. The envelope binds expected file kind/name/SHA-256, its exact bytes, a
# passing dhnt.run/v2 output set/commit, and executor identity. A trusted Bashy
# validator on real k3s independently reads the live Job/Pod, verifies ownership
# and nodeName, checks every digest, and exposes only the verified file as an
# Argo artifact. Missing/tampered/duplicate/oversized results fail the workflow.
# Larger files and trees require authenticated artifact storage and are not
# smuggled through Pod status.
#
# Apply smoke/rbac.yaml first (the `argo-workflow` ServiceAccount cannot touch
# batch/v1 Jobs otherwise). Usage: see ../README.md#mixed-dks-dispatch.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mixed-dks-dispatch
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/part-of: dhnt-dks
    dhnt.io/contract: mixed-dks-dispatch
  annotations:
    dhnt.io/contract: >-
      argo-on-k3s, payload-on-vk-native, hard-placement, no-fallback
spec:
  entrypoint: mixed-dispatch
  onExit: delete-job
  serviceAccountName: argo-workflow
  # Resolve one explicit namespaced repository before executing. This prevents
  # a cluster-global/default repository from silently receiving tenant
  # artifacts and makes a missing ConfigMap/key fail closed.
  artifactRepositoryRef:
    configMap: artifact-repositories
    key: seaweedfs-v1

  # ---- Argo-owned pods: real k3s agent nodes ONLY -------------------------
  # Applies to every pod this workflow creates, including the `resource`
  # template pods below. Hard requirement by construction: the scheduler
  # cannot place these anywhere else, so there is nothing to "fall back" to.
  nodeSelector:
    outpost.dhnt.io/backend: k3s
    kubernetes.io/os: linux
  # Deliberately empty: a virtual-kubelet toleration here would readmit the
  # exact failure mode this template exists to rule out.
  tolerations: []

  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 86400

  arguments:
    parameters:
      # REQUIRED OCI workload for the real-k3s phase. It is never copied into
      # the native Job. The image must be immutable (`@sha256:` digest), and
      # command is a JSON/YAML argv sequence, never shell text.
      - name: k3s-image
      - name: k3s-command
      # REQUIRED, no default — a YAML/JSON flow sequence, e.g.
      #   ["bashy","-c","exit 0"]   or   ["bashy.exe","-c","exit 0"]
      # command[0] names the executable for argv purposes; when the three
      # native-artifact annotations are present, vk-native resolves it to the
      # verified member materialized from that archive.
      - name: job-command
      # REQUIRED, no defaults — the actual vk-native executable delivery
      # contract. The backend validates transport, digest and archive member.
      - name: native-artifact-url
      - name: native-artifact-sha256
      - name: native-artifact-path
      # REQUIRED immutable Bashy worker image for the real-k3s result
      # validator. It reads Pod status (never logs/exec), verifies the bounded
      # dhnt.native-result/v1 payload, and publishes the verified file as an
      # ordinary Argo artifact.
      - name: result-validator-image
      - name: expected-result-name
      - name: expected-result-kind
      - name: expected-result-sha256
      # Explicit target selection. These become kubernetes.io/os and
      # kubernetes.io/arch nodeSelector keys on the payload pod.
      - name: target-os
        value: linux
      - name: target-arch
        value: amd64
      # REQUIRED stable outpost identity (for example `dragon`), preventing
      # same-OS/arch work from drifting to a different native host.
      - name: target-host
      # REQUIRED exact Kubernetes Node object name. This is separately checked
      # against the successful Pod's live spec.nodeName.
      - name: target-node
      # Taint key the native nodes carry. Overridable per fleet.
      # Empty input is rejected by the guarded expression in the Job manifest.
      - name: vk-taint-key
        value: virtual-kubelet.io/provider
      # Native scheduler boundary. If no matching vk-native node can run the
      # payload, the Job controller marks the Job failed after this many
      # seconds so Argo's resource watch observes a terminal condition.
      - name: job-active-deadline-seconds
        value: "300"

  templates:
    - name: mixed-dispatch
      steps:
        - - name: k3s-phase
            template: k3s-phase
        - - name: create-and-watch
            template: create-watch-job
        - - name: validate-native-result
            template: validate-native-result
      outputs:
        parameters:
          - name: native-run
            valueFrom:
              parameter: "{{steps.validate-native-result.outputs.parameters.native-run}}"
        artifacts:
          - name: native-result
            from: "{{steps.validate-native-result.outputs.artifacts.native-result}}"

    # Ordinary OCI work runs only on a real Linux k3s agent.
    - name: k3s-phase
      # command is patched as an argv array after parameter rendering. Keeping
      # it in this block scalar avoids both YAML type coercion and `/bin/sh`.
      podSpecPatch: |
        containers:
          - name: main
            command: {{=sprig.regexMatch('^[[:space:]]*[[][[:space:]]*"[^"]+"([[:space:]]*,[[:space:]]*"[^"]*")*[[:space:]]*[]][[:space:]]*$', workflow.parameters['k3s-command']) ? workflow.parameters['k3s-command'] : 'INVALID'}}
      container:
        # Empty is API-invalid, so a mutable/malformed image fails before a
        # workload container exists. Argo v4 expression tags expose Sprig's
        # RE2 regexMatch.
        image: "{{=sprig.regexMatch('^.+@sha256:[0-9a-f]{64}$', workflow.parameters['k3s-image']) ? workflow.parameters['k3s-image'] : ''}}"
        imagePullPolicy: IfNotPresent

    # ---- The indirection itself -----------------------------------------
    # Runs argoexec on a k3s node. Talks to the API server; it never runs a
    # container on vk-native and never reads the payload pod's logs (vk-native
    # supports neither logs nor exec).
    - name: create-watch-job
      resource:
        action: create
        setOwnerReference: true
        # "Watch" == the resource template polls this Job's status until one
        # of these conditions holds. Success and failure are BOTH explicit, so
        # a Job that can never be scheduled is failed by its native active
        # deadline and the workflow fails rather than passing by omission.
        successCondition: status.succeeded > 0
        failureCondition: status.failed > 0
        manifest: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "{{workflow.name}}-vk-native"
            labels:
              dhnt.io/contract: mixed-dks-dispatch
              dhnt.io/backend: vk-native
          spec:
            # No fallback in time: one attempt, no rescheduling onto another
            # node after a failure.
            backoffLimit: 0
            # Convert before substituting into the embedded YAML so inputs such
            # as "0300" become decimal 300. Non-positive input deliberately
            # renders -1: the Job API requires this field to be greater than
            # zero, so no viable Job (and therefore no pod) can be created.
            activeDeadlineSeconds: {{=asInt(workflow.parameters['job-active-deadline-seconds']) > 0 ? asInt(workflow.parameters['job-active-deadline-seconds']) : -1}}
            completions: 1
            parallelism: 1
            template:
              metadata:
                labels:
                  dhnt.io/contract: mixed-dks-dispatch
                  dhnt.io/backend: vk-native
                annotations:
                  # These three annotations, not the marker image below,
                  # deliver the executable to vk-native. All are required:
                  # a partial tuple is rejected by the backend.
                  outpost.dhnt.io/native-artifact-url: "{{=sprig.regexMatch('^(https://[^[:space:]]+|http://(127[.]0[.]0[.]1|localhost)(:[0-9]+)?/[^[:space:]]+)$', workflow.parameters['native-artifact-url']) ? workflow.parameters['native-artifact-url'] : ''}}"
                  outpost.dhnt.io/native-artifact-sha256: "{{=sprig.regexMatch('^[0-9a-f]{64}$', workflow.parameters['native-artifact-sha256']) ? workflow.parameters['native-artifact-sha256'] : ''}}"
                  outpost.dhnt.io/native-artifact-path: "{{=sprig.regexMatch('^[A-Za-z0-9_][A-Za-z0-9._/-]*$', workflow.parameters['native-artifact-path']) && !sprig.contains('../', workflow.parameters['native-artifact-path']) && !sprig.hasSuffix('/..', workflow.parameters['native-artifact-path']) ? workflow.parameters['native-artifact-path'] : ''}}"
                  # Opt in to Outpost's kubelet-sized (4 KiB) terminal channel.
                  # The validator rejects missing, duplicate, oversized,
                  # malformed, or digest-mismatched result markers.
                  outpost.dhnt.io/termination-log-tail: "true"
              spec:
                restartPolicy: Never
                # vk-native cannot mount projected volumes, and the default
                # SA token IS a projected volume. Must be false.
                automountServiceAccountToken: false
                # Hard placement: native nodes of exactly this os/arch.
                nodeSelector:
                  outpost.dhnt.io/backend: vk-native
                  outpost.dhnt.io/host: "{{workflow.parameters.target-host}}"
                  kubernetes.io/hostname: "{{workflow.parameters.target-node}}"
                  kubernetes.io/os: "{{workflow.parameters.target-os}}"
                  kubernetes.io/arch: "{{workflow.parameters.target-arch}}"
                tolerations:
                  # Empty key + Exists is a wildcard toleration. Render the
                  # API-invalid key "/" instead, so an empty override is
                  # rejected before a viable Job can schedule. Non-empty keys
                  # remain fleet-configurable.
                  - key: "{{=workflow.parameters['vk-taint-key'] != '' ? workflow.parameters['vk-taint-key'] : '/'}}"
                    operator: Exists
                    effect: NoSchedule
                # Exactly one container. No initContainers, no sidecars, no
                # volumes, no envFrom, no valueFrom — the full vk-native
                # capability envelope and nothing beyond it.
                containers:
                  - name: payload
                    # Marker only. vk-native executes the verified archive
                    # member named by the annotations above; it does not pull
                    # or execute an OCI filesystem.
                    image: dhnt.io/native-process
                    imagePullPolicy: Never
                    command: {{workflow.parameters.job-command}}
                    env:
                      - name: DHNT_BACKEND
                        value: vk-native
                      - name: DHNT_WORKFLOW
                        value: "{{workflow.name}}"
                      - name: DHNT_TARGET_OS
                        value: "{{workflow.parameters.target-os}}"
                      - name: DHNT_TARGET_ARCH
                        value: "{{workflow.parameters.target-arch}}"

    # This trusted collector runs on real k3s, never vk-native. It does not
    # trust executor identity embedded by the payload: Job UID ownership,
    # successful Pod uniqueness, and nodeName are read from the live Pod.
    # Backend/OS/arch are the required placement inputs also enforced by the
    # Job's hard nodeSelector.
    - name: validate-native-result
      container:
        image: "{{=sprig.regexMatch('^.+@sha256:[0-9a-f]{64}$', workflow.parameters['result-validator-image']) ? workflow.parameters['result-validator-image'] : ''}}"
        imagePullPolicy: IfNotPresent
        command: ["bashy", "-c"]
        args:
          - |
            set -eu
            self="$0"
            namespace="{{workflow.namespace}}"
            job="{{workflow.name}}-vk-native"
            output_dir=/tmp/dhnt-native-result
            "$self" mkdir -p "$output_dir"
            job_uid=$("$self" kubectl get job "$job" -n "$namespace" -o jsonpath='{.metadata.uid}')
            [ -n "$job_uid" ]
            pods=$("$self" kubectl get pods -n "$namespace" -l "job-name=$job" \
              -o jsonpath='{range .items[?(@.status.phase=="Succeeded")]}{.metadata.name}{"\n"}{end}')
            count=$(printf '%s\n' "$pods" | "$self" grep -c . || true)
            [ "$count" -eq 1 ] || {
              echo "native result: expected exactly one successful Pod, got $count" >&2
              exit 4
            }
            pod="$pods"
            owner_uid=$("$self" kubectl get pod "$pod" -n "$namespace" \
              -o jsonpath='{.metadata.ownerReferences[0].uid}')
            [ "$owner_uid" = "$job_uid" ] || {
              echo "native result: successful Pod is not owned by live Job" >&2
              exit 4
            }
            node=$("$self" kubectl get pod "$pod" -n "$namespace" -o jsonpath='{.spec.nodeName}')
            [ -n "$node" ] && [ "$node" = "{{workflow.parameters.target-node}}" ] || {
              echo "native result: live Pod node does not match expected executor" >&2
              exit 4
            }
            message=$("$self" kubectl get pod "$pod" -n "$namespace" \
              -o jsonpath='{.status.containerStatuses[0].state.terminated.message}')
            printf '%s' "$message" > "$output_dir/message"
            expected_kind="{{=workflow.parameters['expected-result-kind'] == 'file' ? workflow.parameters['expected-result-kind'] : 'INVALID'}}"
            expected_sha256="{{=sprig.regexMatch('^[0-9a-f]{64}$', workflow.parameters['expected-result-sha256']) ? workflow.parameters['expected-result-sha256'] : ''}}"
            "$self" dhnt verify-native-result \
              --expect-name "{{workflow.parameters.expected-result-name}}" \
              --expect-kind "$expected_kind" \
              --expect-sha256 "$expected_sha256" \
              --expect-node "$node" \
              --expect-backend vk-native \
              --expect-os "{{workflow.parameters.target-os}}" \
              --expect-arch "{{workflow.parameters.target-arch}}" \
              --artifact-output "$output_dir/artifact" \
              "$output_dir/message" > "$output_dir/run.json"
      outputs:
        parameters:
          - name: native-run
            valueFrom:
              path: /tmp/dhnt-native-result/run.json
        artifacts:
          - name: native-result
            path: /tmp/dhnt-native-result/artifact
            archive:
              none: {}

    # ---- Delete ----------------------------------------------------------
    # Runs as the workflow's onExit handler, so the Job is removed on success,
    # failure, and cancellation alike. `setOwnerReference` above is the
    # belt-and-braces path for the case where this handler never runs.
    - name: delete-job
      resource:
        action: delete
        flags:
          - job
          - "{{workflow.name}}-vk-native"
          - "-n"
          - "{{workflow.namespace}}"
          - "--ignore-not-found"
