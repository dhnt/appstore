# Bitnami redis chart defaults that diverge from upstream.
architecture: standalone   # 1 master, no replicas — fits a user namespace
auth:
  enabled: true
master:
  persistence:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
metrics:
  enabled: false
