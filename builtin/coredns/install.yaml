# CoreDNS — cluster DNS resolver.
#
# k3s normally writes this manifest to <DataDir>/server/manifests/ at
# startup and the in-process wrangler applies it. In our App Platform
# deploy, that directory creation fails (logs show recurring
# "Failed to process config: lstat .../k3s/server/manifests: no such
# file or directory") so the built-in addon never lands. Without
# CoreDNS no in-cluster pod can resolve external hostnames or even
# kubernetes.default.svc — helm install, kubectl talking to apiserver
# from a pod, headlamp talking to apiserver, etc. all break.
#
# This bundle ships the same Service+ConfigMap+RBAC k3s would have
# applied (CoreDNS v1.12.1 — matches k3s 1.36's pin), but runs CoreDNS
# as one pod per healthy real-k3s node. DKS has to keep DNS available
# even while cross-node Service routing is degraded: node-local
# endpoints make that failure mode explicit and bounded.
#
# Auto-applied at cluster boot via CLUSTER_AUTO_APPLY_BUNDLES.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "pods", "namespaces"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
- kind: ServiceAccount
  name: coredns
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
  NodeHosts: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: "CoreDNS"
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      priorityClassName: "system-cluster-critical"
      serviceAccountName: coredns
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: linux
        # Never place cluster infrastructure on a virtual backend.
        # A sandbox-broken real node is excluded by the owned
        # outpost.dhnt.io/runtime-unavailable taint.
        outpost.dhnt.io/backend: k3s
      containers:
      - name: coredns
        image: rancher/mirrored-coredns-coredns:1.12.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 170Mi
          requests:
            cpu: 100m
            memory: 70Mi
        args: [ "-conf", "/etc/coredns/Corefile" ]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 9153
          name: metrics
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
            scheme: HTTP
      dnsPolicy: Default
      volumes:
      - name: config-volume
        configMap:
          name: coredns
          items:
          - key: Corefile
            path: Corefile
          - key: NodeHosts
            path: NodeHosts
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  annotations:
    prometheus.io/port: "9153"
    prometheus.io/scrape: "true"
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: "CoreDNS"
spec:
  clusterIP: 10.43.0.10
  # Every eligible real node has a CoreDNS DaemonSet endpoint. Keeping
  # traffic local avoids silently depending on cross-node ClusterIP
  # routing for the resolver that is required to diagnose that routing.
  internalTrafficPolicy: Local
  selector:
    k8s-app: kube-dns
  ports:
  - name: dns
    port: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    protocol: TCP
  - name: metrics
    port: 9153
    protocol: TCP
---
# A tiny sandbox canary is scheduled on every real-k3s node, including
# nodes carrying the owned runtime-unavailable taint. Cloudbox observes
# these pods: failure to reach Ready after the grace period taints and
# capability-labels the node; a recovered Ready canary removes only that
# owned taint. The pause image is already the k3s sandbox image, so this
# probe adds no registry dependency and almost no steady-state cost.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dks-runtime-probe
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dks-runtime-probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dks-runtime-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dks-runtime-probe
    spec:
      priorityClassName: "system-node-critical"
      nodeSelector:
        kubernetes.io/os: linux
        outpost.dhnt.io/backend: k3s
      tolerations:
      - key: outpost.dhnt.io/runtime-unavailable
        operator: Exists
        effect: NoSchedule
      containers:
      - name: pause
        image: rancher/mirrored-pause:3.6
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
          limits:
            memory: 4Mi
---
# The DaemonSet keeps one resolver on every eligible node. This PDB
# still guards voluntary multi-node disruption from taking all ready
# resolvers down at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
