# Headlamp — Kubernetes dashboard from kubernetes-sigs/headlamp.
#
# Same bootstrap-Job pattern as kubeflow / training-operators /
# pachyderm. The Job runs `helm install` against the upstream
# Headlamp chart at https://kubernetes-sigs.github.io/headlamp/,
# pinned to chart 0.42.0 (app v0.41.0).
#
# Post-install Headlamp is reachable in-cluster at
#   http://headlamp.headlamp.svc.cluster.local
# and through cloudbox's existing service proxy at
#   https://ai.dhnt.io/matrix/cluster/svc/headlamp/headlamp/
#
# Two cloudbox-specific tunings via --set:
#   1. config.baseURL — Headlamp's frontend assets resolve relative
#      to this prefix. Without it, assets reference `/static/*` at
#      the apex which 404s through our service proxy.
#   2. config.inCluster=true — Headlamp uses its own ServiceAccount
#      token to dial the apiserver. Combined with the
#      cloudbox.dhnt.io/inject-user-token=true label on the Service
#      (set by this manifest), cloudbox's ClusterServiceDirectProxy
#      stamps the *caller's* user-SA token onto requests bound for
#      this Service, so the apiserver enforces per-user RBAC.
#      Net effect: Headlamp sees pods in user-<hash> namespace only.
#
# Pinned to chart 0.42.0 / app v0.41.0. Bump cadence: every 6 months,
# after a smoke on a dev cluster.
#
# Caveats:
#   - Requires cluster egress to artifacthub.io for the Helm chart pull
#     (`alpine/helm` image downloads it at install time).
#   - The headlamp-installer ServiceAccount + cluster-admin binding
#     persist after the Job's TTL; operator deletes them when
#     comfortable. Alternative: re-run /api/cluster/install/headlamp
#     to refresh.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    outpost.dhnt.io/managed: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-installer
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-installer-admin
  labels:
    outpost.dhnt.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp-installer
  namespace: headlamp
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-headlamp
  namespace: headlamp
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: headlamp-installer
      restartPolicy: OnFailure
      containers:
      - name: installer
        # alpine/k8s is the Alpine-maintained image that ships helm,
        # kubectl, and kustomize together. The previous bundle used
        # alpine/helm which has helm only — its final `kubectl label
        # svc` line silently failed with "command not found" under
        # `set -e`, exiting 1 after the (likely successful) helm install.
        image: alpine/k8s:1.30.5
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Log capture without set -e / trap-EXIT shenanigans.
          # Redirect this shell's stdout+stderr into /tmp/install.log.
          # Run each phase explicitly with `$?` capture. At the end,
          # ALWAYS write the log into a ConfigMap (success or failure),
          # then exit with the worst phase's rc.
          # ConfigMap fetches don't need to traverse the slow
          # apiserver→kubelet log proxy, so the operator can read the
          # full helm output via /api/cluster/_admin/cm/headlamp/install-log.
          LOG=/tmp/install.log
          : > "$LOG"
          exec >>"$LOG" 2>&1

          CHART_REF=0.42.0
          rc=0

          echo "==> [step 1] helm repo add"
          helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
          step1=$?
          [ $rc -eq 0 ] && rc=$step1

          echo "==> [step 2] helm repo update"
          helm repo update
          step2=$?
          [ $rc -eq 0 ] && rc=$step2

          echo "==> [step 3] helm upgrade --install"
          # replicaCount=2 + the topology-spread patch in step 4 below
          # = headlamp keeps serving after any one node goes off. On a
          # single-node cluster the second pod is co-tenant (the helm
          # chart's default scheduler config doesn't reject it), so the
          # bump is harmless for small deployments.
          helm upgrade --install headlamp headlamp/headlamp \
            --version ${CHART_REF} \
            --namespace headlamp \
            --set config.baseURL=/matrix/cluster/svc/headlamp/headlamp \
            --set config.inCluster=true \
            --set replicaCount=2 \
            --wait \
            --timeout 5m
          step3=$?
          [ $rc -eq 0 ] && rc=$step3

          echo "==> [step 4] kubectl label svc headlamp (inject-user-token)"
          kubectl label svc headlamp -n headlamp \
            cloudbox.dhnt.io/inject-user-token=true --overwrite
          step4=$?
          [ $rc -eq 0 ] && rc=$step4

          echo "==> [step 5] HA shape: topologySpreadConstraints + PDB"
          # Helm chart 0.42.0 doesn't expose topologySpreadConstraints
          # as a value, so we patch the Deployment directly. Same
          # maxSkew/whenUnsatisfiable shape as the coredns bundle:
          # one-per-node when possible, ScheduleAnyway on single-node
          # clusters. labelSelector matches the chart's standard
          # app.kubernetes.io/name label.
          kubectl patch deployment headlamp -n headlamp --type=strategic --patch='
          spec:
            template:
              spec:
                topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: headlamp
          '
          step5=$?
          [ $rc -eq 0 ] && rc=$step5

          # PDB: maxUnavailable: 1 so kubectl drain / node-upgrade
          # eviction can take at most one of the two replicas at a
          # time. The other stays serving the UI to the operator
          # running the drain.
          echo "==> [step 6] PodDisruptionBudget"
          kubectl apply -f - <<'EOF'
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: headlamp
            namespace: headlamp
            labels:
              app.kubernetes.io/name: headlamp
          spec:
            maxUnavailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: headlamp
          EOF
          step6=$?
          [ $rc -eq 0 ] && rc=$step6

          echo "==> [final] step results: helm-add=$step1 helm-update=$step2 helm-install=$step3 kubectl-label=$step4 ha-patch=$step5 pdb=$step6 final_rc=$rc"

          # Always publish the log to a ConfigMap, even on failure.
          kubectl create cm install-log -n headlamp \
            --from-file=install.log="$LOG" \
            --dry-run=client -o yaml \
            | kubectl apply -f - 1>>"$LOG" 2>>"$LOG"
          # Re-publish so the ConfigMap reflects this final line too.
          kubectl create cm install-log -n headlamp \
            --from-file=install.log="$LOG" \
            --dry-run=client -o yaml \
            | kubectl apply -f - 1>>"$LOG" 2>>"$LOG"

          exit $rc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1
            memory: 512Mi
