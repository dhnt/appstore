# local-path-storage: the full Rancher local-path-provisioner +
# default StorageClass.
#
# Why this bundle exists (vs core-storage, which just patches the
# SC's default annotation): cloudbox runs k3s with `--disable-agent`
# — there is no kubelet on the cloudbox host. k3s' built-in
# `local-storage` addon (HelmChart at /v1.../local-storage.yaml)
# bootstraps a helm-install Job that needs a kubelet to schedule on.
# Until at least one outpost is in `--cluster-mode=agent` AND its
# real kubelet is Ready AND the cloud-provider taint is removed,
# that Job never runs and the StorageClass never gets created.
#
# Even after a kubelet joins, the helm-install Job may not retry if
# it expired during the no-kubelet window. So this bundle deploys
# the provisioner + StorageClass directly via SSA — no helm Job, no
# addon-controller race.
#
# Apply order (recommended):
#   1. At least one outpost in --cluster-mode=agent, kubelet Ready
#   2. POST /api/cluster/install/local-path-storage
#   3. Verify: `kubectl get sc local-path` returns the SC
#   4. Verify: `kubectl -n kube-system get pod -l app=local-path-provisioner` shows it Running
#
# Manifest sourced from rancher/local-path-provisioner v0.0.36
# (the version k3s 1.36.x ships). Template substitutions resolved:
#   %{SYSTEM_DEFAULT_REGISTRY}%    → "" (docker hub)
#   %{DEFAULT_LOCAL_STORAGE_PATH}% → "/var/lib/rancher/k3s/storage"
#                                    (path inside the outpost-runtime
#                                    container; that's where each
#                                    Pod's PV directory lives).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "persistentvolumes", "pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      priorityClassName: "system-node-critical"
      serviceAccountName: local-path-provisioner-service-account
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: local-path-provisioner
        image: "rancher/local-path-provisioner:v0.0.36"
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
      - name: config-volume
        configMap:
          name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    defaultVolumeType: "local"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap":[
      {
        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
        "paths":["/var/lib/rancher/k3s/storage"]
      }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: "rancher/mirrored-library-busybox:1.37.0"
        imagePullPolicy: IfNotPresent
