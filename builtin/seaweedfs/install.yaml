# SeaweedFS — single-pod all-in-one deployment.
#
# Runs master + volume + filer + S3 gateway in one `weed server`
# container, backed by a 50 GiB local-path PVC. Suitable for v1 of
# DKS-on-outposts (single-node ML storage). Not HA — re-running
# `install/seaweedfs` doesn't add replicas.
#
# Endpoints (in-cluster only):
#   http://seaweedfs-s3.seaweedfs-system.svc.cluster.local:8333  (S3-compatible API)
#   http://seaweedfs-filer.seaweedfs-system.svc.cluster.local:8888 (filer HTTP)
#
# ML workloads can use boto3/aws-sdk against the S3 endpoint. Credentials
# are deliberately not part of this public bundle. Before installing it,
# create this operator-owned Secret:
#
#   namespace: seaweedfs-system
#   Secret:    seaweedfs-s3-config
#   key:       s3.json
#
# `s3.json` must be a SeaweedFS S3 identity document. The following explicit
# bootstrap generates high-entropy credentials locally, applies only the
# Secret to the cluster, and leaves no credential material in this repo:
#
#   kubectl create namespace seaweedfs-system \
#     --dry-run=client -o yaml | kubectl apply -f -
#   seaweed_config="$(mktemp)"
#   trap 'rm -f "${seaweed_config}"' EXIT
#   chmod 0600 "${seaweed_config}"
#   seaweed_access_key="$(openssl rand -hex 16)"
#   seaweed_secret_key="$(openssl rand -hex 32)"
#   printf '{"identities":[{"name":"dks-artifacts","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}\n' \
#     "${seaweed_access_key}" "${seaweed_secret_key}" >"${seaweed_config}"
#   kubectl -n seaweedfs-system create secret generic seaweedfs-s3-config \
#     --from-file=s3.json="${seaweed_config}" --dry-run=client -o yaml \
#     | kubectl apply -f -
#   unset seaweed_access_key seaweed_secret_key
#   rm -f "${seaweed_config}"
#   trap - EXIT
#
# Import the credentials from the resulting Secret into the dhnt secrets
# vault (or another operator-controlled secret manager). Retrieve them only
# when needed with:
#
#   kubectl -n seaweedfs-system get secret seaweedfs-s3-config \
#     -o jsonpath='{.data.s3\.json}' | base64 --decode
#
# Existing operators may instead supply their own valid `s3.json` Secret.
# Rotate by replacing the Secret and restarting the StatefulSet:
#
#   kubectl rollout restart statefulset/seaweedfs -n seaweedfs-system
#
# Installation fails closed when the Secret is absent: Kubernetes leaves the
# pod Pending rather than starting SeaweedFS with a public/default identity.
#
# Placement boundary: storage runs only on a Linux, real-k3s DKS node.
# vk-native/vk-podman nodes are execution adapters, not durable Kubernetes
# storage hosts. This pod has no vk toleration or scheduling fallback.
#
# Pinned to chrislusf/seaweedfs:3.71 — known-good. Bump cadence:
# every 6 months, after a smoke on a dev cluster.
#
# Follow-on commits (deferred):
#   - SeaweedFS CSI driver for PVC mounts (today: S3 access only)
#   - Multi-volume replication for HA
#   - Authenticated filer HTTP for non-S3 clients
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs-system
  labels:
    outpost.dhnt.io/managed: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: seaweedfs-system
spec:
  serviceName: seaweedfs
  replicas: 1
  # StatefulSet deletion or an accidental scale-down must not garbage collect
  # the artifact store. PVC removal remains a separate, explicit operation.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      # Required placement, not a preference: never fall through to a virtual
      # kubelet backend when no real-k3s Linux node is available.
      nodeSelector:
        kubernetes.io/os: linux
        outpost.dhnt.io/backend: k3s
      containers:
      - name: weed
        image: chrislusf/seaweedfs:3.71
        # `weed server` runs all the SeaweedFS daemons in a single
        # process: master (chunk locations), volume (chunk storage),
        # filer (POSIX-ish layer), s3 (S3 gateway). One pod is the
        # minimum viable; multi-pod requires master raft + volume
        # replication which is intentionally out of scope for v1.
        args:
        - server
        - -master.dir=/data/m
        - -volume.dir.idx=/data/i
        - -volume.dir=/data/v
        - -filer
        - -s3
        - -s3.config=/config/s3.json
        - -master.volumeSizeLimitMB=1024
        # 000 = no replication; rely on the single-node PVC for
        # durability. When this is moved to multi-pod, bump to 001
        # (1 copy on a different rack) or 010 (different DC).
        - -master.defaultReplication=000
        ports:
        - containerPort: 9333   # master http
          name: master
        - containerPort: 19333  # master grpc
          name: master-grpc
        - containerPort: 8080   # volume http
          name: volume
        - containerPort: 18080  # volume grpc
          name: volume-grpc
        - containerPort: 8888   # filer http
          name: filer
        - containerPort: 18888  # filer grpc
          name: filer-grpc
        - containerPort: 8333   # s3
          name: s3
        readinessProbe:
          httpGet:
            path: /cluster/healthz
            port: 9333
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 4Gi
      volumes:
      - name: config
        secret:
          name: seaweedfs-s3-config
          items:
          - key: s3.json
            path: s3.json
            mode: 0400
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
---
# Headless service for StatefulSet DNS (seaweedfs-0.seaweedfs.seaweedfs-system.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs-system
spec:
  clusterIP: None
  selector:
    app: seaweedfs
  ports:
  - name: master
    port: 9333
  - name: master-grpc
    port: 19333
  - name: volume
    port: 8080
  - name: volume-grpc
    port: 18080
  - name: filer
    port: 8888
  - name: filer-grpc
    port: 18888
  - name: s3
    port: 8333
---
# Stable S3 endpoint Pachyderm + ML workloads target.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs-system
spec:
  selector:
    app: seaweedfs
  ports:
  - name: s3
    port: 8333
    targetPort: 8333
---
# Stable filer endpoint for non-S3 clients (kubectl exec + curl, etc.).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: seaweedfs-system
spec:
  selector:
    app: seaweedfs
  ports:
  - name: filer
    port: 8888
    targetPort: 8888
  - name: filer-grpc
    port: 18888
    targetPort: 18888
---
# Stable master endpoint for the CSI driver (future, when we ship it).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: seaweedfs-system
spec:
  selector:
    app: seaweedfs
  ports:
  - name: master
    port: 9333
    targetPort: 9333
  - name: master-grpc
    port: 19333
    targetPort: 19333
